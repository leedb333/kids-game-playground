name: Build and review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: node scripts/verify-dist.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Cupcake release checks (single worker)
        if: startsWith(github.head_ref, 'release/cooking-v2-cupcake-three')
        run: pnpm test:cupcake-release --reporter=line
      - name: Icecream integration checks
        if: startsWith(github.head_ref, 'release/cooking-v2-icecream')
        run: pnpm exec playwright test tests/icecream.spec.ts tests/icecream-toppings.spec.ts tests/icecream-release.spec.ts --reporter=line
      - name: Retained games core smoke only
        if: startsWith(github.head_ref, 'release/cooking-v2-icecream')
        run: |
          pnpm exec playwright test tests/cupcake-release-smoke.spec.ts --grep "retained " --reporter=line
          pnpm exec playwright test tests/cupcake-three.spec.ts --grep "tablet mixing:" --reporter=line
      - name: Icecream integration captures
        if: always() && startsWith(github.head_ref, 'release/cooking-v2-icecream')
        uses: actions/upload-artifact@v4
        with:
          name: icecream-release-review
          path: playwright-report/icecream
          if-no-files-found: ignore
      - name: Regular regression checks
        if: ${{ !startsWith(github.head_ref, 'release/cooking-v2-cupcake-three') && !startsWith(github.head_ref, 'release/cooking-v2-icecream') }}
        run: pnpm test
      - name: Cupcake review artifacts
        if: always() && startsWith(github.head_ref, 'release/cooking-v2-cupcake-three')
        uses: actions/upload-artifact@v4
        with:
          name: cupcake-release-checks
          path: playwright-report/cupcake-release
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: dist
